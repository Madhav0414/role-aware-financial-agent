<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financial Data Agent — Access Console</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   A private-banking terminal, not a chat product.

   Structure: a THREAD. Question, then its answer directly beneath, then
   the next exchange. Everything about one question stays in one block —
   verdict, pipeline, figure, evidence, feedback — so nothing has to be
   correlated across the screen.

   The refusal remains the primary object: the pipeline strip inside each
   answer card visibly halts, and the card is bordered in the refusal
   colour. You can see the query never ran.
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  --bg:        #0e131a;
  --bg-2:      #131a23;
  --surface:   #172029;
  --surface-2: #1d2833;
  --line:      #26323f;
  --line-2:    #1f2933;

  --text:      #e9e5dc;
  --text-2:    #a8b2bd;
  --text-3:    #6e7a87;
  --text-4:    #4c5661;

  --brass:     #d8a548;
  --brass-dim: #8a6c30;
  --permit:    #52b98a;
  --permit-bg: #10241c;
  --refuse:    #e8735e;
  --refuse-bg: #26150f;

  --t-fin:  #6fa8d6;
  --t-narr: #a98fd6;
  --t-hr:   #e8735e;
  --t-gov:  #d8a548;

  --sans: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2,.8,.3,1);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 14.5px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}

/* brass hairline across the very top — the one ornamental touch */
body::before {
  content: ""; position: fixed; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--brass), var(--brass-dim) 40%, transparent);
  z-index: 20;
}

.mono { font-family: var(--mono); }
.lbl {
  font-family: var(--mono); font-size: 9.5px; font-weight: 500;
  letter-spacing: .18em; text-transform: uppercase; color: var(--text-3);
}

/* ── top bar ──────────────────────────────────────────────────────────── */
.bar {
  display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
  padding: 16px 26px; border-bottom: 1px solid var(--line);
  background: var(--bg-2); position: sticky; top: 0; z-index: 10;
}
.brand { display: flex; align-items: center; gap: 11px; }
.mark {
  width: 26px; height: 26px; border: 1.5px solid var(--brass);
  border-radius: 3px; display: grid; place-items: center;
  font-family: var(--mono); font-size: 12px; font-weight: 700;
  color: var(--brass); letter-spacing: -.04em;
}
.brand b { font-size: 14.5px; font-weight: 600; letter-spacing: -.01em; }
.brand span { font-size: 11.5px; color: var(--text-3); }

.roles { display: flex; gap: 3px; padding: 3px; border-radius: 7px;
         background: var(--surface); border: 1px solid var(--line); }
.roles button {
  background: none; border: 0; border-radius: 5px; cursor: pointer;
  padding: 6px 14px; font: inherit; font-size: 12px; font-weight: 550;
  letter-spacing: .04em; color: var(--text-3);
  transition: all .25s var(--ease);
}
.roles button:hover { color: var(--text); }
.roles button[aria-pressed="true"] {
  background: var(--brass); color: #17120a; font-weight: 650;
}
.roles button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.stats { margin-left: auto; display: flex; gap: 22px; }
.stats div { text-align: right; }
.stats .v { font-family: var(--mono); font-size: 12.5px; color: var(--text-2);
            margin-top: 2px; }

/* ── permissions strip ────────────────────────────────────────────────── */
.perms {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  padding: 10px 26px; border-bottom: 1px solid var(--line-2);
  background: var(--bg); font-size: 12px;
}
.chip {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .05em;
  padding: 3px 8px; border-radius: 3px; border: 1px solid currentColor;
  white-space: nowrap; opacity: .95;
}
.chip.off { opacity: .3; text-decoration: line-through; }
.c-fin { color: var(--t-fin); } .c-narr { color: var(--t-narr); }
.c-hr  { color: var(--t-hr); }  .c-gov  { color: var(--t-gov); }

/* ── thread ───────────────────────────────────────────────────────────── */
.scroll { flex: 1; overflow-y: auto; }
.thread { max-width: 1000px; margin: 0 auto; padding: 30px 26px 40px; }

.empty-state { text-align: center; padding: 70px 20px; color: var(--text-3); }
.empty-state .big { font-size: 30px; margin-bottom: 12px; opacity: .5; }

.xchg { margin-bottom: 34px; animation: rise .45s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

/* the question */
.q {
  display: flex; gap: 13px; align-items: flex-start; margin-bottom: 13px;
}
.q .who {
  flex-shrink: 0; font-family: var(--mono); font-size: 9.5px;
  letter-spacing: .1em; padding: 5px 9px; border-radius: 4px;
  background: var(--surface-2); color: var(--brass); border: 1px solid var(--line);
  margin-top: 2px;
}
.q .txt { font-size: 19px; font-weight: 500; letter-spacing: -.015em;
          line-height: 1.4; padding-top: 3px; }

/* the answer card — everything about this question lives inside */
.card {
  border: 1px solid var(--line); border-left: 3px solid var(--permit);
  border-radius: 9px; background: var(--surface); overflow: hidden;
  transition: border-color .3s var(--ease);
}
.card.no { border-left-color: var(--refuse); }

.card .strip {
  display: flex; align-items: center; gap: 0; padding: 0;
  border-bottom: 1px solid var(--line-2); background: var(--bg-2);
  overflow-x: auto;
}
.step {
  flex: 1; min-width: 118px; padding: 9px 13px;
  border-right: 1px solid var(--line-2); opacity: .3;
  transition: opacity .4s var(--ease);
}
.step:last-child { border-right: 0; }
.step.on { opacity: 1; }
.step .n { font-family: var(--mono); font-size: 9px; color: var(--text-4);
           letter-spacing: .1em; }
.step .s { font-family: var(--mono); font-size: 10.5px; font-weight: 600;
           letter-spacing: .1em; text-transform: uppercase;
           color: var(--text-2); margin-top: 3px;
           display: flex; align-items: center; gap: 5px; }
.step.ok  .s { color: var(--permit); }
.step.bad .s { color: var(--refuse); }
.step .d { font-size: 10.5px; color: var(--text-3); margin-top: 4px;
           line-height: 1.35; }

.body { padding: 20px 22px 22px; }

.vrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        margin-bottom: 15px; }
.verdict {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase;
  padding: 5px 11px; border-radius: 4px;
}
.verdict.ok { color: var(--permit); background: var(--permit-bg);
              border: 1px solid #1e4536; }
.verdict.no { color: var(--refuse); background: var(--refuse-bg);
              border: 1px solid #4a2418; }

.figure {
  font-size: clamp(30px, 5.2vw, 44px); font-weight: 300; letter-spacing: -.03em;
  line-height: 1.1; font-variant-numeric: tabular-nums lining-nums;
  margin: 4px 0 8px; color: var(--text);
}
.answer { font-size: 15.5px; line-height: 1.62; white-space: pre-wrap;
          color: var(--text); margin: 0; }
.answer.no { color: var(--refuse); }
.sub { font-size: 13px; color: var(--text-3); margin-top: 8px; }

.cites { margin-top: 16px; display: flex; flex-direction: column; gap: 5px; }
.cite { font-family: var(--mono); font-size: 10.5px; color: var(--text-3);
        display: flex; gap: 8px; }
.cite b { color: var(--text-4); font-weight: 400; }

/* evidence — collapsed by default so the answer breathes */
details.ev { margin-top: 18px; border-top: 1px solid var(--line-2);
             padding-top: 14px; }
details.ev summary {
  cursor: pointer; list-style: none; font-family: var(--mono); font-size: 10px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--text-3);
  display: flex; align-items: center; gap: 7px;
  transition: color .25s var(--ease);
}
details.ev summary:hover { color: var(--brass); }
details.ev summary::-webkit-details-marker { display: none; }
details.ev summary::before { content: "▸"; transition: transform .25s var(--ease); }
details.ev[open] summary::before { transform: rotate(90deg); }
.item { padding: 12px 0; border-bottom: 1px solid var(--line-2); }
.item:last-child { border-bottom: 0; }
.item .h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.item .t { font-size: 13px; color: var(--text-2); margin-top: 6px;
           line-height: 1.55; }
.item .val { font-family: var(--mono); font-size: 17px; color: var(--text);
             margin-top: 5px; }

/* feedback — emoji buttons, clearly labelled */
.fb { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line-2); }
.fb button {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 7px; padding: 8px 14px; font: inherit; font-size: 12.5px;
  color: var(--text-2); cursor: pointer;
  transition: all .25s var(--ease);
}
.fb button .e { font-size: 15px; line-height: 1; }
.fb button:hover { transform: translateY(-1px); }
.fb .good:hover { border-color: var(--permit); color: var(--permit);
                  background: var(--permit-bg); }
.fb .bad:hover  { border-color: var(--refuse); color: var(--refuse);
                  background: var(--refuse-bg); }
.fb button[aria-pressed="true"].good { border-color: var(--permit);
  color: var(--permit); background: var(--permit-bg); }
.fb button[aria-pressed="true"].bad { border-color: var(--refuse);
  color: var(--refuse); background: var(--refuse-bg); }
.fb input {
  flex: 1; min-width: 200px; background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 7px; padding: 8px 12px;
  font: inherit; font-size: 12.5px;
}
.fb input:focus { outline: 0; border-color: var(--brass); }
.fb .said { font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
            text-transform: uppercase; color: var(--permit); }

.flag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
        color: var(--brass); margin-top: 12px; }

/* ── composer ─────────────────────────────────────────────────────────── */
.composer { border-top: 1px solid var(--line); background: var(--bg-2);
            padding: 14px 26px 16px; }
.cwrap { max-width: 1000px; margin: 0 auto; }
.field { display: flex; gap: 10px; align-items: center;
         background: var(--surface); border: 1px solid var(--line);
         border-radius: 10px; padding: 4px 4px 4px 16px;
         transition: border-color .25s var(--ease); }
.field:focus-within { border-color: var(--brass); }
.field input { flex: 1; background: none; border: 0; color: var(--text);
               font: inherit; font-size: 15px; padding: 11px 0; }
.field input:focus { outline: 0; }
.field input::placeholder { color: var(--text-4); }
.send { background: var(--brass); border: 0; border-radius: 7px;
        width: 38px; height: 38px; cursor: pointer; color: #17120a;
        display: grid; place-items: center;
        transition: all .25s var(--ease); }
.send:hover { filter: brightness(1.12); }
.send:disabled { opacity: .35; cursor: default; }

.chips-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.sug { background: none; border: 1px solid var(--line); border-radius: 100px;
       padding: 5px 12px; font: inherit; font-size: 11.5px; color: var(--text-3);
       cursor: pointer; transition: all .25s var(--ease); }
.sug:hover { border-color: var(--brass); color: var(--brass); }
.hint { font-size: 11px; color: var(--text-4); margin-top: 9px; }
.hint kbd { font-family: var(--mono); font-size: 10px; background: var(--surface-2);
            border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; }

/* ── audit drawer ─────────────────────────────────────────────────────── */
details.audit { max-width: 1000px; margin: 0 auto 10px; }
details.audit summary { cursor: pointer; list-style: none; padding: 9px 0;
  font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--text-3);
  display: flex; align-items: center; gap: 7px; }
details.audit summary::-webkit-details-marker { display: none; }
details.audit summary::before { content: "▸"; transition: transform .25s var(--ease); }
details.audit[open] summary::before { transform: rotate(90deg); }
.log { max-height: 200px; overflow-y: auto; border: 1px solid var(--line);
       border-radius: 8px; background: var(--surface); padding: 4px 12px; }
.log .r { display: grid; grid-template-columns: 56px 62px 1fr; gap: 11px;
          padding: 6px 0; border-bottom: 1px solid var(--line-2);
          font-family: var(--mono); font-size: 10.5px; align-items: baseline; }
.log .r:last-child { border-bottom: 0; }
.log .a { color: var(--permit); } .log .d { color: var(--refuse); }
.log .w { color: var(--text-3); word-break: break-word; }

.spin { display: inline-block; width: 12px; height: 12px;
        border: 2px solid var(--line); border-top-color: var(--brass);
        border-radius: 50%; animation: sp .7s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

@media (max-width: 720px) {
  .stats { display: none; }
  .bar, .perms, .thread, .composer { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important;
                           transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<div class="bar">
  <div class="brand">
    <div class="mark">FA</div>
    <div>
      <b>Financial Data Agent</b><br>
      <span>Access-controlled answers · Apple SEC filings</span>
    </div>
  </div>
  <div class="roles" id="roles" role="group" aria-label="Session identity"></div>
  <div class="stats" id="stats"></div>
</div>

<div class="perms" id="perms"></div>

<div class="scroll">
  <div class="thread" id="thread">
    <div class="empty-state">
      <div class="big">⌥</div>
      <div>Ask a question below. The same question answers differently
           depending on which role is selected.</div>
    </div>
  </div>

  <div style="padding:0 26px 26px">
    <details class="audit">
      <summary>Audit ledger — decisions only, never document text</summary>
      <div class="log" id="log"></div>
    </details>
  </div>
</div>

<div class="composer">
  <div class="cwrap">
    <form class="field" id="form" autocomplete="off">
      <input id="q" placeholder="Ask about revenue, margins, risk factors, headcount…"
             aria-label="Question">
      <button class="send" id="go" type="submit" aria-label="Ask">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
             stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div class="chips-row" id="sugs"></div>
    <div class="hint">Press <kbd>/</kbd> to focus · role switch changes what
      the same question returns</div>
  </div>
</div>

<script>
const STEPS = [
  ["01","Plan","declare what answering requires"],
  ["02","Guard","check the plan against the role"],
  ["03","Retrieve","gated SQL + gated search"],
  ["04","Compose","figures computed, prose optional"],
  ["05","Audit","append the decision"],
];

const SUGGESTIONS = [
  "What was net sales in FY2025?",
  "What is revenue per employee for FY2025?",
  "What was net sales in FY2023?",
  "How did revenue change over the years?",
  "What was Greater China revenue in FY2024?",
  "What are the main risk factors?",
  "How many employees are there?",
  "What is executive compensation?",
];

let ctx = null, role = "CEO", turn = 0;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const tagClass = t => t.startsWith("financials") ? "c-fin"
  : t.startsWith("narrative") ? "c-narr" : t.startsWith("hr") ? "c-hr" : "c-gov";

function countUp(el, text) {
  const m = text.match(/([\d,]+\.?\d*)/);
  if (!m || matchMedia("(prefers-reduced-motion: reduce)").matches) {
    el.textContent = text; return;
  }
  const target = parseFloat(m[1].replace(/,/g, ""));
  if (!isFinite(target) || target > 1e12) { el.textContent = text; return; }
  const dec = (m[1].split(".")[1] || "").length;
  const t0 = performance.now();
  (function f(now) {
    const p = Math.min((now - t0) / 600, 1), e = 1 - Math.pow(1 - p, 3);
    el.textContent = text.replace(m[1], (target * e).toLocaleString("en-US",
      { minimumFractionDigits: dec, maximumFractionDigits: dec }));
    if (p < 1) requestAnimationFrame(f);
  })(t0);
}

function renderBar() {
  $("stats").innerHTML = [
    ["Newest", "FY" + ctx.corpus_max_fy],
    ["Model", ctx.llm_provider || "deterministic"],
    ["Feedback", ctx.feedback_count],
  ].map(([k, v]) =>
    `<div><div class="lbl">${k}</div><div class="v">${v}</div></div>`).join("");

  $("roles").innerHTML = ctx.roles.map(r =>
    `<button data-role="${r.name}" aria-pressed="${r.name === role}">${r.name}</button>`
  ).join("");
  document.querySelectorAll(".roles button").forEach(b =>
    b.onclick = () => { role = b.dataset.role; renderBar(); renderPerms(); });
}

function renderPerms() {
  const r = ctx.roles.find(x => x.name === role);
  $("perms").innerHTML =
    `<span class="lbl">${r.name} may read</span>` +
    r.allowed_tags.map(t => `<span class="chip ${tagClass(t)}">${t}</span>`).join("") +
    (r.denied_tags.length
      ? `<span class="lbl" style="margin-left:8px">denied</span>` +
        r.denied_tags.map(t =>
          `<span class="chip off ${tagClass(t)}">${t}</span>`).join("")
      : "") +
    (r.recent_years_only
      ? `<span class="lbl" style="margin-left:8px">FY${r.min_fiscal_year}+ only</span>`
      : "");
}

function stripHTML(state) {
  return STEPS.map(([n, label, hint]) => {
    const s = state ? state[label.toLowerCase()] : null;
    const cls = s === "ok" ? "on ok" : s === "bad" ? "on bad" : "";
    const icon = s === "ok" ? "✓" : s === "bad" ? "✕" : "";
    const d = (state && state.detail && state.detail[label.toLowerCase()]) || hint;
    return `<div class="step ${cls}"><div class="n">${n}</div>
      <div class="s">${icon} ${label}</div><div class="d">${esc(d)}</div></div>`;
  }).join("");
}

function exchangeHTML(id, question, askedAs) {
  return `<div class="xchg" id="x${id}">
    <div class="q"><span class="who">${askedAs}</span>
      <div class="txt">${esc(question)}</div></div>
    <div class="card" id="c${id}">
      <div class="strip">${stripHTML(null)}</div>
      <div class="body"><span style="color:var(--text-3)">
        <span class="spin"></span> &nbsp;working…</span></div>
    </div></div>`;
}

function fillCard(id, r, question) {
  const card = $("c" + id);
  card.classList.toggle("no", !r.allowed);

  const denied = [...(r.denied_tags || []), ...(r.denied_periods || [])];
  card.querySelector(".strip").innerHTML = stripHTML({
    plan: "ok",
    guard: r.allowed ? "ok" : "bad",
    retrieve: r.allowed ? "ok" : null,
    compose: r.allowed ? "ok" : null,
    audit: "ok",
    detail: {
      plan: `${r.plan.metrics.length || "no"} metric(s) · ${r.plan.periods.join(", ")}`,
      guard: r.allowed ? "plan permitted" : `denied — ${denied.join(", ")}`,
      retrieve: r.allowed
        ? `${(r.figures || []).length} figures · ${(r.passages || []).length} passages`
        : "not reached — nothing fetched",
      compose: r.allowed
        ? (r.source === "llm" ? "phrased by model" : "computed in Python")
        : "not reached",
      audit: "decision appended",
    },
  });

  const heroSingle = r.allowed && (r.figures || []).length === 1;
  const tags = r.plan.tags.map(t =>
    `<span class="chip ${tagClass(t)}">${t}</span>`).join("");

  const figs = (heroSingle ? [] : (r.figures || [])).map(f => `
    <div class="item"><div class="h"><span class="lbl">${esc(f.metric)}</span>
      <span class="lbl">${esc(f.period)}</span>
      <span class="chip ${tagClass(f.tag)}">${f.tag}</span></div>
      <div class="val">${esc(f.display)}</div>
      <div class="cite"><b>└</b>${esc(f.citation)}</div></div>`).join("");

  const psgs = (r.passages || []).slice(0, 3).map(p => `
    <div class="item"><div class="h"><span class="lbl">${esc(p.citation)}</span>
      <span class="chip ${tagClass(p.tag)}">${p.tag}</span>
      <span class="lbl">score ${p.score}</span></div>
      <div class="t">${esc((p.snippet || p.text).slice(0, 250))}…</div></div>`).join("");

  const evCount = (heroSingle ? 0 : (r.figures || []).length)
    + Math.min((r.passages || []).length, 3);

  card.querySelector(".body").innerHTML = `
    <div class="vrow">
      <span class="verdict ${r.allowed ? "ok" : "no"}">
        ${r.allowed ? "✓ permitted" : "✕ refused"}</span>
      <span class="lbl">${r.plan.intent}</span>${tags}
    </div>

    ${heroSingle
      ? `<div class="figure" id="h${id}"></div>
         <div class="sub">${esc(r.answer)}</div>`
      : `<p class="answer ${r.allowed ? "" : "no"}">${esc(r.answer)}</p>`}

    ${r.allowed && r.citations.length ? `<div class="cites">${
      r.citations.slice(0, 4).map(c =>
        `<div class="cite"><b>└</b>${esc(c)}</div>`).join("")}</div>` : ""}

    ${r.injection_detected && r.injection_detected.length
      ? `<div class="flag">⚠ Embedded instructions detected and ignored:
         ${r.injection_detected.join(", ")}</div>` : ""}

    ${r.reranked_by_feedback
      ? `<div class="flag">↻ Ranking adjusted by your earlier feedback</div>` : ""}

    ${evCount ? `<details class="ev"><summary>Evidence · ${evCount} item(s)</summary>
        ${figs}${psgs}</details>` : ""}

    ${r.allowed ? `
      <div class="fb">
        <button class="good" id="g${id}" aria-pressed="false">
          <span class="e">👍</span> Good answer</button>
        <button class="bad" id="b${id}" aria-pressed="false">
          <span class="e">👎</span> Wrong answer</button>
        <input id="i${id}" placeholder="What should it have said? (optional)">
        <span class="said" id="s${id}"></span>
      </div>` : ""}`;

  if (heroSingle) countUp($("h" + id), r.figures[0].display);

  if (r.allowed) {
    const send = async v => {
      await fetch("/api/feedback", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          role, question, answer: r.answer, verdict: v,
          chunk_ids: (r.passages || []).map(p => p.id),
          correction: ($("i" + id).value.trim() || null),
        }),
      });
      $("g" + id).setAttribute("aria-pressed", String(v === "up"));
      $("b" + id).setAttribute("aria-pressed", String(v === "down"));
      $("s" + id).textContent = "recorded — ask again to see the change";
      loadCtx(); loadLog();
    };
    $("g" + id).onclick = () => send("up");
    $("b" + id).onclick = () => send("down");
  }
}

async function ask(question) {
  const id = ++turn, askedAs = role;
  if (turn === 1) $("thread").innerHTML = "";
  $("thread").insertAdjacentHTML("beforeend",
    exchangeHTML(id, question, askedAs));
  $("x" + id).scrollIntoView({ behavior: "smooth", block: "start" });
  $("go").disabled = true; $("q").value = "";

  const res = await fetch("/api/ask", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ role: askedAs, question }),
  });
  fillCard(id, await res.json(), question);
  $("go").disabled = false;
  loadLog();
}

async function loadLog() {
  const { rows } = await (await fetch("/api/audit?limit=24")).json();
  $("log").innerHTML = rows.length ? rows.map(e =>
    `<div class="r"><span style="color:var(--text-4)">${e.ts.slice(11, 19)}</span>
     <span style="color:var(--text-2)">${esc(e.role)}</span>
     <span class="w"><span class="${e.allowed ? "a" : "d"}">${
       e.allowed ? "allow" : "deny "}</span> ${esc(e.context)}</span></div>`
  ).join("") : '<div class="r"><span class="w">empty</span></div>';
}

async function loadCtx() {
  ctx = await (await fetch("/api/context")).json();
  renderBar(); renderPerms();
}

(async function init() {
  await loadCtx();
  $("sugs").innerHTML = SUGGESTIONS.map(s =>
    `<button class="sug" type="button">${s}</button>`).join("");
  document.querySelectorAll(".sug").forEach(b =>
    b.onclick = () => ask(b.textContent));

  $("form").onsubmit = e => {
    e.preventDefault();
    const q = $("q").value.trim();
    if (q) ask(q);
  };
  addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== $("q")) {
      e.preventDefault(); $("q").focus();
    }
  });

  loadLog();

  const p = new URLSearchParams(location.search);
  const want = (p.get("role") || "").toUpperCase();
  if (ctx.roles.some(r => r.name === want)) { role = want; renderBar(); renderPerms(); }
  if (p.get("q")) ask(p.get("q"));
})();
</script>
